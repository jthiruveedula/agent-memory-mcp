title: Agent Memory MCP
description: Self-improving agent memory server with knowledge graph, preference learning, and tool recommendations.
baseurl: /agent-memory-mcp
url: https://jthiruveedula.github.io
theme: minima
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    line_numbers: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - src
  - dist
  - .github
  - .vscode
  - .claude
  - .cursor
  - opencode.json
  - CLAUDE.md
  - README.md
  - package.json
  - package-lock.json
  - tsconfig.json
  - .gitignore
  - LICENSE
