<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <header class="site-header" role="banner">
      <nav class="nav-container" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" class="logo" aria-label="Agent Memory MCP Home">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="currentColor"/>
            <path d="M8 12h16M8 16h12M8 20h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span class="logo-text">Agent Memory MCP</span>
        </a>
        
        <div class="nav-links">
          <a href="{{ '/#features' | relative_url }}" class="nav-link">Features</a>
          <a href="{{ '/#install' | relative_url }}" class="nav-link">Install</a>
          <a href="{{ '/#usage' | relative_url }}" class="nav-link">Usage</a>
          <a href="{{ '/#api' | relative_url }}" class="nav-link">API</a>
          <a href="https://github.com/jthiruveedula/agent-memory-mcp" class="nav-link nav-github" target="_blank" rel="noopener">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.536-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
            </svg>
            GitHub
          </a>
        </div>
        
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span class="hamburger"></span>
        </button>
      </nav>
    </header>

    <main id="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer" role="contentinfo">
      <div class="footer-container">
        <div class="footer-brand">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="currentColor"/>
            <path d="M8 12h16M8 16h12M8 20h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span>Agent Memory MCP</span>
        </div>
        <p class="footer-text">Self-improving agent memory with knowledge graphs, preference learning & tool recommendations.</p>
        <div class="footer-links">
          <a href="https://github.com/jthiruveedula/agent-memory-mcp" target="_blank" rel="noopener">GitHub</a>
          <a href="https://github.com/jthiruveedula/agent-memory-mcp/issues" target="_blank" rel="noopener">Issues</a>
          <a href="https://modelcontextprotocol.io" target="_blank" rel="noopener">MCP Spec</a>
        </div>
        <p class="footer-copyright">MIT Licensed • Last updated: July 14, 2026</p>
      </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </body>
</html>
